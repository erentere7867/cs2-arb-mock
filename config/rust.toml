game = "rust"
markets = ["skinport", "waxpeer", "dmarket"]
dmarket_if_configured = true

[market_regime]
min_index_items = 1
min_case_items = 2
max_price_age_hours = 24
short_loss_pct = 3.0
long_loss_pct = 8.0
item_underperformance_pct = 5.0 # Maximum 24h shortfall vs. the broad index, in percentage points.

[relist]
cross_venue = true

# Illustrative mock fees; not current fee quotes unless linked.
[fees.skinport]
buyer_fee_pct = 0.0
seller_fee_pct = 8.0
buyer_fixed_fee = 0
seller_fixed_fee = 0

# Unused for Rust; the shared fee config contains all supported platforms.
[fees.csfloat]
buyer_fee_pct = 0.0
seller_fee_pct = 2.0
buyer_fixed_fee = 0
seller_fixed_fee = 0

[fees.dmarket]
buyer_fee_pct = 0.0
seller_fee_pct = 7.0
buyer_fixed_fee = 0
seller_fixed_fee = 0

[fees.waxpeer]
buyer_fee_pct = 0.0 # Assumption for purchases using existing marketplace balance.
seller_fee_pct = 6.0 # Standard fee: https://faq.waxpeer.com/faq/fees-sell
buyer_fixed_fee = 0
seller_fixed_fee = 0

# Examples apply only to Waxpeer. Fixed network / bank fees are assumed zero until configured.
[fees.waxpeer.funding]
crypto_deposit = { pct = 1.0, fixed = 0 } # Most coins: https://faq.waxpeer.com/faq/fees-deposit
crypto_withdrawal = { pct = 1.5, fixed = 0 } # Standard crypto rate excluding network: https://faq.waxpeer.com/faq/fees-withdraw
bank_cashout = { pct = 0.0, fixed = 0 }

# Both snapshots refresh about every 10s: https://docs.waxpeer.com/api/buy-items/prices-snapshot
[rate_limits.waxpeer.default]
max_requests = 1
window_seconds = 6

# Shared 8/300s budget; leave headroom: https://docs.skinport.com/introduction/rate-limits
[rate_limits.skinport.items]
path = "/v1/items"
max_requests = 6
window_seconds = 330
quota_group = "catalogue"

[rate_limits.skinport.sales_history]
path = "/v1/sales/history"
max_requests = 6
window_seconds = 330
quota_group = "catalogue"

# Signed reads: 10/s market items, 6/s last sales. https://dmarket.com/faq#startUsingTradingAPI
[rate_limits.dmarket.default]
max_requests = 1
window_seconds = 1
