[package]
name = "cs2-arb-markets"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cs2-arb-core.workspace = true
cs2-arb-net.workspace = true
chrono.workspace = true
async-trait.workspace = true
# `brotli` lets reqwest transparently decode Skinport's mandatory `br` responses.
reqwest = { workspace = true, features = ["brotli"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
brotli = "9"
tokio = { workspace = true, features = ["fs", "test-util", "macros", "rt-multi-thread"] }
