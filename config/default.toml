markets = ["skinport", "csfloat", "dmarket", "waxpeer"]
dmarket_if_configured = true

# Illustrative mock fees, NOT verified marketplace schedules unless linked.
# Percentage points (5.0 = 5%); fixed fees are USD cents.
[fees.skinport]
buyer_fee_pct = 0.0
seller_fee_pct = 8.0
buyer_fixed_fee = 0
seller_fixed_fee = 0

[fees.csfloat]
buyer_fee_pct = 0.0
seller_fee_pct = 2.0
buyer_fixed_fee = 0
seller_fixed_fee = 0

[fees.dmarket]
buyer_fee_pct = 0.0
seller_fee_pct = 7.0
buyer_fixed_fee = 0
seller_fixed_fee = 0

[fees.waxpeer]
buyer_fee_pct = 0.0 # Assumption for purchases using existing marketplace balance.
seller_fee_pct = 6.0 # Standard fee: https://faq.waxpeer.com/faq/fees-sell
buyer_fixed_fee = 0
seller_fixed_fee = 0

# Examples apply only to Waxpeer. Fixed network / bank fees are assumed zero until configured.
[fees.waxpeer.funding]
crypto_deposit = { pct = 1.0, fixed = 0 } # Most coins: https://faq.waxpeer.com/faq/fees-deposit
crypto_withdrawal = { pct = 1.5, fixed = 0 } # Standard crypto rate excluding network: https://faq.waxpeer.com/faq/fees-withdraw
bank_cashout = { pct = 0.0, fixed = 0 }

# Both snapshots refresh about every 10s: https://docs.waxpeer.com/api/buy-items/prices-snapshot
[rate_limits.waxpeer.default]
max_requests = 1
window_seconds = 6

# Shared 8/300s budget; leave headroom: https://docs.skinport.com/introduction/rate-limits
[rate_limits.skinport.items]
path = "/v1/items"
max_requests = 6
window_seconds = 330
quota_group = "catalogue"

[rate_limits.skinport.sales_history]
path = "/v1/sales/history"
max_requests = 6
window_seconds = 330
quota_group = "catalogue"

# Conservative local pacing; https://docs.csfloat.com/ does not publish a numeric quota.
[rate_limits.csfloat.default]
max_requests = 1
window_seconds = 10

# Signed reads: 10/s market items, 6/s last sales. https://dmarket.com/faq#startUsingTradingAPI
[rate_limits.dmarket.default]
max_requests = 1
window_seconds = 1

[retry]
base_seconds = 1
cap_seconds = 300

[events]
poll_interval_secs = 120
window_duration_secs = 345600
trigger_branches = ["staging", "prerelease"]

[spread]
annual_opportunity_rate_pct = 10.0
hold_days = 7
min_net_profit = 50

[dip]
lookback_days = 30
k_sigma = 2.0
volume_multiplier = 1.5
max_drop_pct = 30.0
stop_loss_pct = 25.0
max_hold_days = 21
require_verified_sales = true

[risk]
max_position_notional = 10000
max_item_exposure = 25000
max_total_exposure = 100000
daily_drawdown_cap = 10000

[market_regime]
min_index_items = 3
min_case_items = 2
max_price_age_hours = 24
short_loss_pct = 3.0
long_loss_pct = 8.0
item_underperformance_pct = 5.0 # Maximum 24h shortfall vs. the broad index, in percentage points.

[peg_bid]
target_margin_pct = 7.0
bid_increment = 1
hold_days = 7
annual_opportunity_rate_pct = 10.0
lookback_days = 7
min_median_samples = 3
cooldown_secs = 300
min_reprice_delta = 2
lower_to_ceiling = false

[relist]
lookback_days = 7
min_median_samples = 1
volume_window_days = 7
min_sales_for_ask_fill = 15
min_listing_age_secs = 3600
require_verified_sales = true

# Days of live quotes, verified sales and buy-book polls kept in events.db for
# the regime gate and `backtest --history-db`; 30 covers a 7-day hold plus the
# 21-day dip max hold.
[market_history]
retention_days = 30
