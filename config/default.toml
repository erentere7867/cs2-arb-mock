markets = ["skinport", "csfloat", "dmarket", "waxpeer"]
dmarket_if_configured = true

# Marketplace fees researched 2026-11-28. Percentage points (5.0 = 5%); fixed fees are USD cents.
# Funding legs model a real-money round trip on EVERY trade: deposit on entry, withdrawal and
# bank cash-out on exit. That is deliberately conservative for strategies that recycle balance
# on one venue, and accurate for spread, whose proceeds must move back to the buying venue.
# Where sources disagree the higher cost is used. Re-check before relying on any margin.

# Skinport: 8% standard seller fee since 18 Jul 2025 (6% only for listings >= 1,000 USD, not
# modelled); no buyer fee; bank payout carries no Skinport fee (third-party reviews, e.g.
# https://steamdb.com/en/markets/skinport). Deposit costs for buyers are UNVERIFIED.
[fees.skinport]
buyer_fee_pct = 0.0
seller_fee_pct = 8.0
buyer_fixed_fee = 0
seller_fixed_fee = 0

# CSFloat: 2% seller fee, no buyer fee; bank withdrawal is tiered 2.5% (< $2,500 lifetime sales)
# down to 0.5% (>= $100k). New accounts pay 2.5%. ACH deposits ~1.5%, cards ~2.8%
# (third-party reviews, e.g. https://cs2journal.com/markets/csfloat/; csfloat.com/faq is JS-only).
[fees.csfloat]
buyer_fee_pct = 0.0
seller_fee_pct = 2.0
buyer_fixed_fee = 0
seller_fixed_fee = 0

[fees.csfloat.funding]
crypto_deposit = { pct = 1.5, fixed = 0 } # Deposit leg (US ACH rate); name kept for config compatibility.
crypto_withdrawal = { pct = 0.0, fixed = 0 }
bank_cashout = { pct = 2.5, fixed = 0 } # Entry tier of the tiered withdrawal fee.

# DMarket: CS2 marketplace sales are 2% for liquid items but up to 10% for low-priced or
# low-liquidity items (https://dmarket.com/faq "DMarket Fees"); buyers pay no fee. The fee is
# per item and not exposed by the read API, so 5% is a middle scenario. Withdrawal is 0-2.5%
# by method in third-party reviews; 2% is used. Deposit costs are UNVERIFIED.
[fees.dmarket]
buyer_fee_pct = 0.0
seller_fee_pct = 5.0
buyer_fixed_fee = 0
seller_fixed_fee = 0

[fees.dmarket.funding]
crypto_deposit = { pct = 0.0, fixed = 0 }
crypto_withdrawal = { pct = 0.0, fixed = 0 }
bank_cashout = { pct = 2.0, fixed = 0 }

# Waxpeer: 6% standard seller fee (2% with the mobile app linked, not assumed)
# https://faq.waxpeer.com/faq/fees-sell ; no separate buyer fee when spending balance.
[fees.waxpeer]
buyer_fee_pct = 0.0
seller_fee_pct = 6.0
buyer_fixed_fee = 0
seller_fixed_fee = 0

# 1% deposit for most coins https://faq.waxpeer.com/faq/fees-deposit ; 1.5% + network fee for
# USDT/USDC withdrawals https://faq.waxpeer.com/faq/fees-withdraw . Sale proceeds sit in an
# eight-day hold balance before withdrawal https://faq.waxpeer.com/faq/hold-balance .
[fees.waxpeer.funding]
crypto_deposit = { pct = 1.0, fixed = 0 }
crypto_withdrawal = { pct = 1.5, fixed = 0 }
bank_cashout = { pct = 0.0, fixed = 0 }

# Both snapshots refresh about every 10s: https://docs.waxpeer.com/api/buy-items/prices-snapshot
[rate_limits.waxpeer.default]
max_requests = 1
window_seconds = 6

# Shared 8/300s budget; leave headroom: https://docs.skinport.com/introduction/rate-limits
[rate_limits.skinport.items]
path = "/v1/items"
max_requests = 6
window_seconds = 330
quota_group = "catalogue"

[rate_limits.skinport.sales_history]
path = "/v1/sales/history"
max_requests = 6
window_seconds = 330
quota_group = "catalogue"

# Conservative local pacing; https://docs.csfloat.com/ does not publish a numeric quota.
[rate_limits.csfloat.default]
max_requests = 1
window_seconds = 10

# Signed reads: 10/s market items, 6/s last sales. https://dmarket.com/faq#startUsingTradingAPI
[rate_limits.dmarket.default]
max_requests = 1
window_seconds = 1

[retry]
base_seconds = 1
cap_seconds = 300

[events]
poll_interval_secs = 120
window_duration_secs = 345600
trigger_branches = ["staging", "prerelease"]

[spread]
annual_opportunity_rate_pct = 10.0
hold_days = 7
min_net_profit = 50

[dip]
lookback_days = 30
k_sigma = 2.0
volume_multiplier = 1.5
max_drop_pct = 30.0
stop_loss_pct = 25.0
max_hold_days = 21
require_verified_sales = true

[risk]
max_position_notional = 10000
max_item_exposure = 25000
max_total_exposure = 100000
daily_drawdown_cap = 10000

[market_regime]
min_index_items = 3
min_case_items = 2
max_price_age_hours = 24
short_loss_pct = 3.0
long_loss_pct = 8.0
item_underperformance_pct = 5.0 # Maximum 24h shortfall vs. the broad index, in percentage points.

[peg_bid]
target_margin_pct = 7.0
bid_increment = 1
hold_days = 7
annual_opportunity_rate_pct = 10.0
lookback_days = 7
min_median_samples = 3
cooldown_secs = 300
min_reprice_delta = 2
lower_to_ceiling = false
# Exit value comes from verified sales; asks can only lower it. Tier-only bids receive the
# worst floats sellers route to them, so they are valued at the tier's 25th percentile.
tier_only_exit_quantile = 0.25
# Waxpeer has no verified sales feed, so with no haircut configured it places no peg bids.
# Uncomment to value its exits at the ask median less this percentage (an assumption).
# ask_only_exit_haircut_pct = 10.0

[relist]
lookback_days = 7
min_median_samples = 1
volume_window_days = 7
min_sales_for_ask_fill = 15
min_listing_age_secs = 3600
require_verified_sales = true
# A listing fills on volume alone only while a fresh lowest ask (<= 6 h old) or the median
# of the last 24 h of verified sales is at or above it; without that evidence it waits.
max_market_age_secs = 21600
recent_sales_window_hours = 24
# List 1 cent under the current market when it is below the rolling median, and reprice an
# unfilled ask down to that level after a day instead of resting above a falling market.
undercut = 1
reprice_after_secs = 86400

# Days of live quotes, verified sales and book polls kept in events.db for the
# regime gate and `backtest --history-db`; 40 covers the dip's 30-day lookback
# plus its 7-day liquidity window.
[market_history]
retention_days = 40
