# Illustrative mock fees, NOT verified marketplace schedules.
# Percentage points (5.0 = 5%); fixed fees are USD cents.
[fees.skinport]
buyer_fee_pct = 0.0
seller_fee_pct = 8.0
buyer_fixed_fee = 0
seller_fixed_fee = 0

[fees.csfloat]
buyer_fee_pct = 0.0
seller_fee_pct = 2.0
buyer_fixed_fee = 0
seller_fixed_fee = 0

[fees.dmarket]
buyer_fee_pct = 0.0
seller_fee_pct = 7.0
buyer_fixed_fee = 0
seller_fixed_fee = 0

[rate_limits.skinport.items]
path = "/v1/items"
max_requests = 8
window_seconds = 300

[rate_limits.skinport.sales_history]
path = "/v1/sales/history"
max_requests = 8
window_seconds = 300

# Conservative mock defaults, not verified server policies.
[rate_limits.csfloat.default]
max_requests = 1
window_seconds = 1

[rate_limits.dmarket.default]
max_requests = 1
window_seconds = 1

[retry]
base_seconds = 1
cap_seconds = 300

[events]
poll_interval_secs = 120
window_duration_secs = 345600
trigger_branches = ["staging", "prerelease"]

[spread]
annual_opportunity_rate_pct = 10.0
hold_days = 7
min_net_profit = 50

[dip]
lookback_days = 30
k_sigma = 2.0
require_verified_sales = true

[risk]
max_position_notional = 10000
max_item_exposure = 25000
max_total_exposure = 100000
daily_drawdown_cap = 10000
